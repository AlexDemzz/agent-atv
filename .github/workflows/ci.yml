name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # P2 (plugin <-> real bridge) and C2 (e2e) spawn the bridge in --fake mode with python3.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.13']
        pyatv: [true]
        include:
          # Development machines may run the bridge tests on 3.14; the pinned pyatv set targets 3.10-3.13.
          - python: '3.14'
            pyatv: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.pyatv
        run: python -m pip install -r packages/homebridge-agent-atv/python/requirements.txt
      - run: npm run test:python

  # W2: the screen worker's fake against the pinned pymobiledevice3, in its own env as in the plugin
  # (its dependencies don't share pins with pyatv's). 3.11 builds sslpsk-pmd3 from source.
  screen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r packages/homebridge-agent-atv/python/requirements-screen.txt
      - run: npm run test:python
